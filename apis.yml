aid: ramain
name: RamAIn
description: >-
  RamAIn builds AI agents that automate any UI task with natural language. A Y
  Combinator (W26) company backed by General Catalyst and Nexus Venture Partners,
  RamAIn operates web portals, desktop apps, and legacy systems the way a human
  does — reading screens and interacting with UI elements — then compiles those
  workflows into reusable, self-healing automations that can be published and
  managed as APIs. It targets high-friction, document-heavy back-office work
  across mortgage, finance, healthcare, and insurance.
